<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wooden logs -->
  <rect x="4" y="28" width="56" height="8" rx="2" fill="#8B4513"/>
  <rect x="4" y="38" width="56" height="8" rx="2" fill="#A0522D"/>
  <rect x="4" y="48" width="56" height="8" rx="2" fill="#8B4513"/>

  <!-- Wood grain lines -->
  <line x1="12" y1="30" x2="12" y2="34" stroke="#6B3510" stroke-width="1"/>
  <line x1="32" y1="30" x2="32" y2="34" stroke="#6B3510" stroke-width="1"/>
  <line x1="52" y1="30" x2="52" y2="34" stroke="#6B3510" stroke-width="1"/>
  <line x1="20" y1="40" x2="20" y2="44" stroke="#7B4520" stroke-width="1"/>
  <line x1="44" y1="40" x2="44" y2="44" stroke="#7B4520" stroke-width="1"/>
  <line x1="16" y1="50" x2="16" y2="54" stroke="#6B3510" stroke-width="1"/>
  <line x1="40" y1="50" x2="40" y2="54" stroke="#6B3510" stroke-width="1"/>

  <!-- Rope bindings -->
  <rect x="14" y="26" width="4" height="32" rx="1" fill="#D2691E" opacity="0.8"/>
  <rect x="46" y="26" width="4" height="32" rx="1" fill="#D2691E" opacity="0.8"/>

  <!-- Mast -->
  <rect x="30" y="4" width="4" height="28" fill="#6B3510"/>

  <!-- Flag -->
  <polygon points="34,4 54,12 34,20" fill="#DC143C"/>
</svg>
